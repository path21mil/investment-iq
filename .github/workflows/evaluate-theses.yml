name: Daily Thesis Evaluation

on:
  schedule:
    # Runs daily at 06:00 UTC (pre-market US / early morning)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  evaluate-theses:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Thesis Evaluator
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }} # e.g. https://your-domain.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering Thesis Evaluator..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/evaluate-theses")

          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response status: $status"
          echo "Response body: $body"

          if [ "$status" -ne 200 ]; then
            echo "Cron execution failed with status $status"
            exit 1
          fi