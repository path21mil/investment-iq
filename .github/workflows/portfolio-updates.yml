name: Portfolio Updates Cron

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: # Keeps the manual run button enabled

jobs:
  run-portfolio-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portfolio Updates
        run: |
          curl -s -f -X GET "${{ secrets.APP_URL }}/api/cron/portfolio-updates" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"