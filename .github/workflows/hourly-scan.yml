name: Hourly Market Scan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # Keeps the manual run button enabled

jobs:
  run-market-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Market Scanner
        run: |
          curl -s -f -X GET "${{ secrets.APP_URL }}/api/cron/scan-market" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"